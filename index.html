<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScamShield NG</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f8;
      margin: 0;
      padding: 30px 15px;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: #fff;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin-top: 0;
      color: #0b7a3b;
    }

    p {
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      resize: vertical;
      box-sizing: border-box;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      padding: 12px 22px;
      font-size: 16px;
      background: #0b7a3b;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      flex: 1;
    }

    button:hover {
      background: #095f2e;
    }

    button.secondary {
      background: #666;
      flex: 0.5;
    }

    button.secondary:hover {
      background: #555;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      white-space: pre-wrap;
      line-height: 1.6;
      padding: 15px;
      background: #f9f9f9;
      border-radius: 8px;
      border-left: 4px solid #0b7a3b;
    }

    #details {
      margin-top: 10px;
      font-size: 16px;
      color: #444;
      white-space: pre-wrap;
    }

    .tip {
      margin-top: 20px;
      padding: 12px;
      background: #f1fff5;
      border-left: 4px solid #0b7a3b;
      border-radius: 8px;
    }

    .status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
      font-weight: bold;
    }

    .status.speaking {
      background: #d4edda;
      color: #155724;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>ScamShield NG 🇳🇬</h2>
    <p>Paste an SMS below to analyze whether it looks safe, suspicious, or likely to be a scam.</p>

    <textarea id="sms" placeholder="Paste SMS here..."></textarea>
    
    <div class="button-group">
      <button onclick="checkSMS()">Analyze</button>
      <button class="secondary" onclick="stopVoice()">Stop</button>
    </div>

    <div id="status"></div>
    <h3 id="result"></h3>
    <p id="details"></p>

    <div class="tip">
      <b>Tip:</b> Never click unknown links or share OTP with anyone.
    </div>
  </div>

  <script>
    function speak(text) {
      try {
        window.speechSynthesis.cancel();
        let speech = new SpeechSynthesisUtterance(text);
        speech.lang = "en-US";
        speech.rate = 1;
        speech.pitch = 1;
        speech.volume = 1;
        
        speech.onstart = function() {
          console.log("Speaking:", text);
          showStatus("🔊 Speaking...", "speaking");
        };
        
        speech.onend = function() {
          console.log("Finished speaking");
          hideStatus();
        };
        
        speech.onerror = function(event) {
          console.error("Speech error:", event.error);
          showStatus("❌ Voice error", "error");
        };
        
        window.speechSynthesis.speak(speech);
      } catch (error) {
        console.error("Error in speak function:", error);
        showStatus("❌ Error: " + error.message, "error");
      }
    }

    function stopVoice() {
      window.speechSynthesis.cancel();
      hideStatus();
    }

    function showStatus(message, className) {
      const status = document.getElementById("status");
      status.innerText = message;
      status.className = "status " + className;
    }

    function hideStatus() {
      const status = document.getElementById("status");
      setTimeout(() => {
        status.innerText = "";
        status.className = "status";
      }, 1500);
    }

    function containsLink(text) {
      return text.includes("http") || text.includes("www");
    }

    function checkSMS() {
      let text = document.getElementById("sms").value.toLowerCase().trim();

      if (!text) {
        document.getElementById("result").innerText = "Please paste a message first.";
        speak("Please paste a message first.");
        return;
      }

      // High risk words - Security & Account related (20 points each)
      let highRiskWords = [
        "otp",
        "pin",
        "password",
        "verify",
        "verification",
        "account blocked",
        "account suspended",
        "account locked",
        "card details",
        "bvn",
        "nin",
        "security alert",
        "unusual activity",
        "login",
        "sign in",
        "reset password",
        "confirm identity",
        "authenticate",
        "mfa",
        "two factor"
      ];

      // Medium risk words - Urgency & Financial (10 points each)
      let mediumRiskWords = [
        "urgent",
        "immediately",
        "action required",
        "click",
        "click here",
        "tap here",
        "dear customer",
        "limited time",
        "offer expires",
        "claim",
        "reward",
        "prize",
        "winner",
        "congratulations",
        "payment failed",
        "failed transaction",
        "refund",
        "cashback",
        "loan approved",
        "reactivate",
        "delivery failed",
        "parcel",
        "customs fee",
        "investment",
        "double your money",
        "guaranteed return",
        "free money",
        "free bonus",
        "wire transfer",
        "send money",
        "transfer funds",
        "bank details",
        "atm",
        "airtime",
        "recharge"
      ];

      // Very suspicious shortened URLs
      let badLinks = [
        "bit.ly",
        "tinyurl",
        "goo.gl",
        "rb.gy",
        "t.co",
        "pay-now",
        "secure-login",
        "update-kyc",
        "freebonus",
        "verify-account",
        "confirm-payment",
        "reset-pin"
      ];

      let score = 0;
      let triggers = [];
      let reasons = [];

      // Check high risk words
      highRiskWords.forEach(word => {
        if (text.includes(word)) {
          score += 20;
          triggers.push(word);
          reasons.push("🔴 Sensitive keyword detected: " + word);
        }
      });

      // Check medium risk words
      mediumRiskWords.forEach(word => {
        if (text.includes(word)) {
          score += 10;
          triggers.push(word);
          reasons.push("🟡 Risk keyword detected: " + word);
        }
      });

      // Check for generic links
      if (containsLink(text)) {
        score += 30;
        triggers.push("link detected");
        reasons.push("🔴 Suspicious link detected");
      }

      // Check for specific bad links
      badLinks.forEach(link => {
        if (text.includes(link)) {
          score += 40;
          triggers.push(link);
          reasons.push("🔴 Known malicious link: " + link);
        }
      });

      score = Math.min(score, 100);

      let result = "";
      let voiceMessage = "";
      let recommendation = "";

      if (score >= 70) {
        result = "❌ SCAM MESSAGE (" + score + "% risk)";
        voiceMessage = "Warning! This is a scam message. Do not click links, reply, or share personal information.";
        recommendation = "❌ Do NOT click any links, reply to this message, or provide personal/financial information.";
      } else if (score >= 40) {
        result = "⚠️ SUSPICIOUS MESSAGE (" + score + "% risk)";
        voiceMessage = "Warning. This message looks suspicious. Be careful.";
        recommendation = "⚠️ Verify the sender independently. Do not click links or provide personal information.";
      } else if (score >= 20) {
        result = "🟡 CAUTION MESSAGE (" + score + "% risk)";
        voiceMessage = "This message needs attention.";
        recommendation = "🟡 Low risk but stay alert. Verify sender before responding.";
      } else {
        result = "✅ SAFE MESSAGE (" + score + "% risk)";
        voiceMessage = "This message appears to be safe.";
        recommendation = "✅ No major threats detected. Proceed normally.";
      }

      let details = "\n📊 ANALYSIS RESULTS:\n\n";
      details += "Risk Score: " + score + "/100\n";
      details += "Detected Threats: " + (triggers.length > 0 ? [...new Set(triggers)].join(", ") : "None") + "\n\n";
      
      if (reasons.length > 0) {
        details += "REASONS:\n";
        reasons.forEach(reason => {
          details += "• " + reason + "\n";
        });
      } else {
        details += "REASONS:\n• No suspicious patterns found\n";
      }
      
      details += "\nRECOMMENDATION:\n" + recommendation;

      document.getElementById("result").innerText = result;
      document.getElementById("details").innerText = details;

      // Speak warning for risky messages
      if (score >= 40) {
        speak(voiceMessage);
      }
    }
  </script>
</body>
</html>
