<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScamShield NG</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f8;
      margin: 0;
      padding: 30px 15px;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: #fff;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin-top: 0;
      color: #0b7a3b;
    }

    p {
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      resize: vertical;
      box-sizing: border-box;
    }

    button {
      margin-top: 15px;
      padding: 12px 22px;
      font-size: 16px;
      background: #0b7a3b;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #095f2e;
    }

    #result {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
      white-space: pre-wrap;
    }

    #details {
      margin-top: 10px;
      font-size: 16px;
      color: #444;
    }

    .tip {
      margin-top: 20px;
      padding: 12px;
      background: #f1fff5;
      border-left: 4px solid #0b7a3b;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>ScamShield NG 🇳🇬</h2>
    <p>Paste an SMS below to analyze whether it looks safe, suspicious, or likely to be a scam.</p>

    <textarea id="sms" placeholder="Paste SMS here..."></textarea>
    <button onclick="analyzeMessage()">Analyze</button>

    <h3 id="result"></h3>
    <p id="details"></p>

    <div class="tip">
      <b>Tip:</b> Never click unknown links or share OTP with anyone.
    </div>
  </div>

<script>

function analyzeMessage() {

    let text = document.getElementById("sms").value.toLowerCase();

    let score = 0;
    let triggers = [];
    let reasons = [];
    let category = "No scam pattern detected";

    // Suspicious links
    const badLinks = [
        "bit.ly",
        "tinyurl",
        "t.co",
        ".xyz",
        ".top",
        ".online",
        ".click",
        "http://",
        "https://"
    ];

    // Scam keywords and risk scores
    const scamPatterns = {
        "password": 30,
        "otp": 35,
        "pin": 30,
        "bvn": 25,
        "verify account": 30,
        "click here": 20,
        "urgent": 15,
        "immediately": 15,
        "winner": 20,
        "congratulations": 15,
        "free money": 30,
        "investment": 25,
        "loan approved": 25,
        "grant": 20,
        "claim now": 25,
        "send money": 30,
        "transfer money": 30,
        "airdrop": 20
    };

    // Nigerian scam categories
    const scamCategories = {
        "bvn": "Bank Verification Scam",
        "otp": "Account Takeover / Phishing Scam",
        "investment": "Investment Fraud Scam",
        "loan": "Fake Loan Scam",
        "nysc": "Fake NYSC Scam",
        "cbn": "Fake Government/Bank Scam",
        "grant": "Fake Grant Scam",
        "airdrop": "Crypto Scam",
        "winner": "Fake Giveaway Scam"
    };

    // Check suspicious links
    badLinks.forEach(link => {
        if(text.includes(link)) {
            score += 40;
            triggers.push(link);
            reasons.push("Contains a suspicious link or URL pattern");
        }
    });

    // Check scam keywords
    Object.keys(scamPatterns).forEach(word => {
        if(text.includes(word)) {
            score += scamPatterns[word];
            triggers.push(word);
            reasons.push(`Detected scam keyword: "${word}"`);
        }
    });

    // Detect scam category
    Object.keys(scamCategories).forEach(word => {
        if(text.includes(word)) {
            category = scamCategories[word];
        }
    });

    // Detect social engineering behaviour
    if(text.includes("share") && (text.includes("code") || text.includes("otp"))) {
        score += 35;
        reasons.push("Requests sensitive security information");
    }

    if(text.includes("money") || text.includes("payment")) {
        score += 20;
        reasons.push("Involves possible financial request");
    }

    if(text.includes("urgent") || text.includes("immediately")) {
        score += 15;
        reasons.push("Uses pressure or urgency tactics");
    }

    if(text.includes("click")) {
        score += 15;
        reasons.push("Encourages user to take immediate action");
    }

    // Maximum score is 100
    score = Math.min(score, 100);

    let result = "";
    let recommendation = "";

    if(score >= 60) {
        result = "❌ LIKELY SCAM";
        recommendation = "Do not click links, send money, or share OTP, passwords, BVN, or personal information.";
        speak("Warning. This message appears to be a scam.");
    }
    else if(score >= 30) {
        result = "⚠️ SUSPICIOUS MESSAGE";
        recommendation = "Verify the sender and confirm information before taking any action.";
    }
    else {
        result = "✅ SAFE MESSAGE";
        recommendation = "No major threat detected. Continue practising safe online behaviour.";
    }

    let report = `${result}

Risk Score: ${score}%

Detected Scam Type: ${category}

Detected Indicators: ${[...new Set(triggers)].join(", ") || "None"}

Why This Result:
${reasons.length > 0 ? reasons.join("\n") : "No suspicious behaviour detected"}

Safety Recommendation: ${recommendation}

Powered by ScamShield.ng`;

    document.getElementById("result").innerText = report;
}

function speak(message) {
    let speech = new SpeechSynthesisUtterance(message);
    speech.rate = 1;
    speech.pitch = 1;
    window.speechSynthesis.speak(speech);
}

</script>
</body>
</html>
