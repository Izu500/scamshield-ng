<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScamShield NG</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f8;
      margin: 0;
      padding: 30px 15px;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: #fff;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin-top: 0;
      color: #0b7a3b;
    }

    p {
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      resize: vertical;
      box-sizing: border-box;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 22px;
      font-size: 16px;
      background: #0b7a3b;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      flex: 1;
      min-width: 120px;
    }

    button:hover {
      background: #095f2e;
    }

    button.secondary {
      background: #666;
    }

    button.secondary:hover {
      background: #555;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      white-space: pre-wrap;
      line-height: 1.6;
      padding: 15px;
      background: #f9f9f9;
      border-radius: 8px;
      border-left: 4px solid #0b7a3b;
    }

    .status {
      margin-top: 10px;
      padding: 10px 15px;
      border-radius: 5px;
      font-size: 14px;
      display: none;
      font-weight: bold;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }

    .status.info {
      background: #d1ecf1;
      color: #0c5460;
      display: block;
    }

    .tip {
      margin-top: 20px;
      padding: 12px;
      background: #f1fff5;
      border-left: 4px solid #0b7a3b;
      border-radius: 8px;
    }

    .voice-info {
      margin-top: 10px;
      padding: 10px;
      background: #f0f0f0;
      border-radius: 5px;
      font-size: 12px;
      color: #666;
    }

    .voice-status {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #999;
      border-radius: 50%;
      margin-right: 5px;
    }

    .voice-status.active {
      background: #0b7a3b;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>ScamShield NG 🇳🇬</h2>
    <p>Paste an SMS below to analyze whether it looks safe, suspicious, or likely to be a scam.</p>

    <textarea id="sms" placeholder="Paste SMS here..."></textarea>
    
    <div class="button-group">
      <button onclick="analyzeMessage()">Analyze</button>
      <button class="secondary" onclick="testVoice()">Test Voice</button>
      <button class="secondary" onclick="stopSpeech()">Stop Voice</button>
    </div>

    <div id="status" class="status"></div>
    <div id="voiceInfo" class="voice-info"></div>
    <div id="result"></div>

    <div class="tip">
      <b>Tip:</b> Never click unknown links or share OTP with anyone.
    </div>
  </div>

<script>

// Global speech variables
let isSpeaking = false;
let supportsSpeech = 'speechSynthesis' in window;

// Show status messages
function showStatus(message, type = 'info', duration = 4000) {
    const statusEl = document.getElementById('status');
    statusEl.innerText = message;
    statusEl.className = 'status ' + type;
    
    if (duration > 0) {
        setTimeout(() => {
            statusEl.className = 'status';
        }, duration);
    }
}

// Update voice info
function updateVoiceInfo(message) {
    const voiceInfo = document.getElementById('voiceInfo');
    voiceInfo.innerHTML = '<span class="voice-status"></span>' + message;
}

// Stop any ongoing speech
function stopSpeech() {
    if (supportsSpeech && window.speechSynthesis) {
        window.speechSynthesis.cancel();
        isSpeaking = false;
        document.querySelector('.voice-status')?.classList.remove('active');
        updateVoiceInfo('Voice stopped');
        showStatus('✓ Voice stopped', 'success', 2000);
    }
}

// Test voice function
function testVoice() {
    console.log("Testing voice...");
    console.log("Speech Synthesis supported:", supportsSpeech);
    
    if (!supportsSpeech) {
        showStatus("❌ Speech Synthesis not supported on this browser", 'error');
        updateVoiceInfo('Speech Synthesis: NOT SUPPORTED');
        return;
    }

    const synth = window.speechSynthesis;
    console.log("Synth object:", synth);
    console.log("Synth paused:", synth.paused);
    
    const voices = synth.getVoices();
    console.log("Available voices:", voices.length);
    
    if (voices.length === 0) {
        updateVoiceInfo('No voices available - waiting for voices to load...');
        console.log("No voices loaded yet, waiting...");
        return;
    }

    updateVoiceInfo('🔊 Speaking: Test message...');
    showStatus('🔊 Playing test voice...', 'info', 0);
    
    try {
        const utterance = new SpeechSynthesisUtterance("This is a test. The voice system is working.");
        utterance.rate = 1;
        utterance.pitch = 1;
        utterance.volume = 1;
        
        // Select voice
        if (voices.length > 0) {
            utterance.voice = voices[0];
            console.log("Using voice:", voices[0].name);
        }

        utterance.onstart = () => {
            console.log("Speech started");
            isSpeaking = true;
            document.querySelector('.voice-status')?.classList.add('active');
        };

        utterance.onend = () => {
            console.log("Speech ended");
            isSpeaking = false;
            document.querySelector('.voice-status')?.classList.remove('active');
            updateVoiceInfo('✓ Test voice completed');
            showStatus('✓ Test voice completed', 'success', 2000);
        };

        utterance.onerror = (event) => {
            console.error("Speech error:", event.error);
            isSpeaking = false;
            document.querySelector('.voice-status')?.classList.remove('active');
            showStatus("❌ Voice error: " + event.error, 'error');
            updateVoiceInfo('❌ Error: ' + event.error);
        };

        synth.speak(utterance);
        console.log("Utterance queued");
    } catch (error) {
        console.error("Error:", error);
        showStatus("❌ Error: " + error.message, 'error');
    }
}

// Main analyze function
function analyzeMessage() {
    let text = document.getElementById("sms").value.toLowerCase();

    if (!text.trim()) {
        document.getElementById("result").innerText = "⚠️ Please enter an SMS to analyze";
        showStatus("❌ Text area is empty", 'error');
        return;
    }

    let score = 0;
    let triggers = [];
    let reasons = [];
    let category = "No scam pattern detected";

    // Suspicious links
    const badLinks = [
        "bit.ly",
        "tinyurl",
        "t.co",
        ".xyz",
        ".top",
        ".online",
        ".click",
        "http://",
        "https://"
    ];

    // Scam keywords and risk scores
    const scamPatterns = {
        "password": 30,
        "otp": 35,
        "pin": 30,
        "bvn": 25,
        "verify account": 30,
        "click here": 20,
        "urgent": 15,
        "immediately": 15,
        "winner": 20,
        "congratulations": 15,
        "free money": 30,
        "investment": 25,
        "loan approved": 25,
        "grant": 20,
        "claim now": 25,
        "send money": 30,
        "transfer money": 30,
        "airdrop": 20
    };

    // Nigerian scam categories
    const scamCategories = {
        "bvn": "Bank Verification Scam",
        "otp": "Account Takeover / Phishing Scam",
        "investment": "Investment Fraud Scam",
        "loan": "Fake Loan Scam",
        "nysc": "Fake NYSC Scam",
        "cbn": "Fake Government/Bank Scam",
        "grant": "Fake Grant Scam",
        "airdrop": "Crypto Scam",
        "winner": "Fake Giveaway Scam"
    };

    // Check suspicious links
    badLinks.forEach(link => {
        if (text.includes(link)) {
            score += 40;
            triggers.push(link);
            reasons.push("Contains suspicious link: " + link);
        }
    });

    // Check scam keywords
    Object.keys(scamPatterns).forEach(word => {
        if (text.includes(word)) {
            score += scamPatterns[word];
            triggers.push(word);
            reasons.push("Contains scam keyword: " + word);
        }
    });

    // Detect scam category
    Object.keys(scamCategories).forEach(word => {
        if (text.includes(word)) {
            category = scamCategories[word];
        }
    });

    // Detect social engineering behaviour
    if (text.includes("share") && (text.includes("code") || text.includes("otp"))) {
        score += 35;
        reasons.push("Requests sensitive security information");
    }

    if (text.includes("money") || text.includes("payment")) {
        score += 20;
        reasons.push("Involves possible financial request");
    }

    if (text.includes("urgent") || text.includes("immediately")) {
        score += 15;
        reasons.push("Uses pressure or urgency tactics");
    }

    if (text.includes("click")) {
        score += 15;
        reasons.push("Encourages immediate action");
    }

    // Maximum score is 100
    score = Math.min(score, 100);

    let result = "";
    let recommendation = "";
    let voiceMessage = "";

    if (score >= 60) {
        result = "❌ LIKELY SCAM";
        recommendation = "Do not click links, send money, or share OTP, passwords, BVN, or personal information.";
        voiceMessage = "Warning! This message appears to be a scam. Do not click any links or share personal information.";
    }
    else if (score >= 30) {
        result = "⚠️ SUSPICIOUS MESSAGE";
        recommendation = "Verify the sender and confirm information before taking any action.";
        voiceMessage = "This message looks suspicious. Please verify the sender before taking any action.";
    }
    else {
        result = "✅ SAFE MESSAGE";
        recommendation = "No major threat detected. Continue practising safe online behaviour.";
        voiceMessage = "This message appears to be safe.";
    }

    let report = result + "\n\n";
    report += "Risk Score: " + score + "%\n\n";
    report += "Detected Scam Type: " + category + "\n\n";
    report += "Detected Indicators: " + ([...new Set(triggers)].length > 0 ? [...new Set(triggers)].join(", ") : "None") + "\n\n";
    report += "Why This Result:\n";
    report += (reasons.length > 0 ? reasons.join("\n") : "No suspicious behaviour detected") + "\n\n";
    report += "Safety Recommendation:\n" + recommendation + "\n\n";
    report += "Powered by ScamShield.ng";

    document.getElementById("result").innerText = report;
    
    // Trigger voice if high risk or any risk
    if (score >= 30) {
        speakWarning(voiceMessage);
    }
}

// Speak warning with proper handling
function speakWarning(message) {
    if (!supportsSpeech) {
        showStatus("⚠️ Voice not supported on this browser", 'error');
        updateVoiceInfo('Speech Synthesis: NOT SUPPORTED');
        return;
    }

    const synth = window.speechSynthesis;
    
    // Get voices
    let voices = synth.getVoices();
    
    if (voices.length === 0) {
        console.log("Voices not loaded, attempting to load...");
        updateVoiceInfo('Waiting for voices to load...');
        // Try again after a short delay
        setTimeout(() => speakWarning(message), 500);
        return;
    }

    // Cancel previous speech
    synth.cancel();

    try {
        const utterance = new SpeechSynthesisUtterance(message);
        utterance.rate = 1;
        utterance.pitch = 1;
        utterance.volume = 1;
        utterance.lang = 'en-US';
        
        // Try to use English voice
        const englishVoice = voices.find(v => v.lang.startsWith('en'));
        if (englishVoice) {
            utterance.voice = englishVoice;
        } else {
            utterance.voice = voices[0];
        }

        utterance.onstart = () => {
            console.log("Speech started");
            isSpeaking = true;
            document.querySelector('.voice-status')?.classList.add('active');
            updateVoiceInfo('🔊 Speaking...');
            showStatus('🔊 Warning voice playing...', 'info', 0);
        };

        utterance.onend = () => {
            console.log("Speech ended");
            isSpeaking = false;
            document.querySelector('.voice-status')?.classList.remove('active');
            updateVoiceInfo('✓ Voice complete');
            showStatus('✓ Voice completed', 'success', 2000);
        };

        utterance.onerror = (event) => {
            console.error("Speech error:", event.error);
            isSpeaking = false;
            document.querySelector('.voice-status')?.classList.remove('active');
            updateVoiceInfo('❌ Error: ' + event.error);
            showStatus("❌ Voice error: " + event.error, 'error');
        };

        console.log("Speaking:", message);
        synth.speak(utterance);
    } catch (error) {
        console.error("Error in speakWarning:", error);
        showStatus("❌ Error: " + error.message, 'error');
        updateVoiceInfo('❌ Error: ' + error.message);
    }
}

// Initialize voices on page load
window.addEventListener('load', () => {
    if (supportsSpeech) {
        const synth = window.speechSynthesis;
        const voices = synth.getVoices();
        console.log("Page loaded - Available voices:", voices.length);
        
        if (voices.length > 0) {
            updateVoiceInfo('✓ Speech ready (' + voices.length + ' voices)');
        } else {
            updateVoiceInfo('⏳ Loading voices...');
        }

        // Listen for voices change
        synth.onvoiceschanged = () => {
            const voicesLoaded = synth.getVoices();
            console.log("Voices loaded:", voicesLoaded.length);
            updateVoiceInfo('✓ Speech ready (' + voicesLoaded.length + ' voices)');
        };
    } else {
        updateVoiceInfo('❌ Speech Synthesis not supported');
    }
});

</script>
</body>
</html>
